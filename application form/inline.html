<!DOCTYPE html>
<html>
	<head>
		<title>Cascading stylesheet</title>
		
	</head>
	<body>
		<table align="center" cellspacing="0" cellpadding="0">
			<tr>
				<td style="width:900px; height:50px; background-color: green;">
					<table cellspacing="0" cellpadding="0">
						<tr>
							<td style="width:300px; height: 50px; background-color:red; text-align:center;">box1</td>
							<td style="width:300px; height: 50px; background-color:pink;">box2</td>
							<td style="width:300px; height: 50px; background-color:skyblue;">box3</td>
						</tr>
					</table>
				</td>
			</tr>
			<tr>
				<td style="width:900px; height:150px; background-image:url('flower.jpeg'); background-repeat: no-repeat; background-size:cover; background-position:center;"></td>
			</tr>
		</table>


		<h1 style="color:blue; font-size:50px; border: 1px solid black;display: inline-block; width:1000px;">this is a heading.</h1>
		<h1 style="color:blue; font-size:50px; border: 1px solid black;">this is a heading.</h1>
		<a href="#" style="display: block;">dsjfhdskjh</a>
		<a href="#" >dsjfhdskjh</a>

		inline css --- style attribute
		internal css-- style tag
		
	
	
	</body>

</html>

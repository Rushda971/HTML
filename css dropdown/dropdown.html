<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dropdown</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      .nav {
        width: 100%;
        height: auto;
        background-color: brown;
        color: white;
        padding-left: 30%;
      }
      .nav ul {
        margin: 0;
        padding: 0;
      }

      .nav ul li {
        display: inline-block;
        padding: 7px 20px;
      }
      .nav ul li:hover {
        background-color: black;
        color: white;
      }
      .nav ul li a {
        color: white;
        text-decoration: none;
        font-size: 18px;
      }
      .dropdwn1 {
        position: relative;
      }
      .dropdwn1 ul {
        position: absolute;
        background-color: brown;
        left: 0;
        top: 100%;
        display: none;
        width: 94px;
      }
      .dropdwn1 ul li {
        font-size: 18px;
        width: 100%;
      }
      .dropdwn1:hover > ul {
        display: block;
      }
      .dropdwn2{
        position: relative;
      }
      .dropdwn2 ul {
        position: absolute;
        background-color: brown;
        left: 100%;
        top: 0%;
        display: none;
        width: 94px;
      }
      .dropdwn2 ul li {
        font-size: 18px;
        width: 100%;
      }
      .dropdwn2:hover > ul {
        display: block;
      }

    </style>
  </head>
  <body>
    <div class="nav">
      <ul>
        <li><a href="">Home</a></li>
        <li><a href="">About</a></li>
        <li class="dropdwn1">
          <a href="">Service</a>
          <ul>
            <li>service1</li>
            <li class="dropdwn2">service2
              <ul>
                <li>Item1</li>
                <li>Item2</li>
                <li>Item3</li>
              </ul>
            </li>
            <li>service3</li>
          </ul>
        </li>
        <li><a href="">Contact</a></li>
      </ul>
    </div>
  </body>
</html>

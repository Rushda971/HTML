<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<!-- <link rel="stylesheet" type="text/css" href="css/cs.css"> -->
	<style>
		*{
			box-sizing:border-box;
			margin:0;
		}
		.drop{
		background-color:darkslateblue;
		height:auto;
		width:100%;
	
		padding-left:30%;
		}
		.drop ul{
			margin:0;
			padding:0;

		}
		.drop ul li{
			display:inline-block;
			padding:6px 10px;
		}
		.drop ul li a{
		color:white;
		text-decoration: none;
		font-size: 16px;
		}
		.drop ul li:hover{
			background-color:purple;
			color:white;
		}
		.abt {
			position:relative;
		}
		.abt ul{
			position:absolute;
			background-color:darkslateblue;
			left:0;
			top:100%;
			display:none;
			width:78px;
		}
		.abt ul li{
			font-size:16px;
			width: 100%;
		}
		.abt:hover>ul{
			display:block;
		}
	</style>
</head>
<body>
<!-- code ko directly open karne ke liye .code in path which directly open your folder -->
<div class="drop">
	<ul>
		<li><a href="#">Home</a></li>
		<li class="abt">
			<a href="#">About us</a>
				<ul>
					<li><a href="#">Info1</a></li>
					<li><a href="#">Info2</a></li>
					<li><a href="#">Info3</a></li>
				</ul>
		</li>
		<li><a href="#">Service</a></li>
		<li><a href="#">Contact</a></li>
	</ul>
</div>
</body>
</html>

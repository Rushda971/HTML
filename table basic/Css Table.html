<!DOCTYPE html>
<html>
	<head>
		<title>CSS table</title>
	</head>
	<body>
		<table align="center" cellspacing="0px" cellpadding="0px">
			<tr>
				<td style="width:800px;height:100px;background-color:blue;">
				<table  align="center" cellspacing="0px" cellpadding="0px">
					<tr>
						<td style="width:400px;height:100px;background-color:yellow;">box1<td>
						<td style="width:400px;height:100px;background-color:black;">box2<td>	
					</tr>
				</table>
				</td>
			</tr>
			<tr>
				<td style="width:800px;height:200px;background-color:blue;">
				<table  align="center" cellspacing="0px" cellpadding="0px">
				<tr>
					<td style="width:200px;height:200px;background-color:pink;">box3</td>
					<td style="width:400px;height:200px;background-color:green;">
					<table align="center" cellspacing="0px" cellpadding="0px">
					<tr>
					<td style="width:400px;height:100px;background-color:red;">box3</td>
					</tr>
					<tr>
					<td style="width:400px;height:100px;background-color:orange;">box4</td>
					</tr>
					</table>
					</td>
					<td style="width:200px;height:200px;background-color:grey;"></td>
				</tr>
				</table>
				</td>
			</tr>
		</table>
	</body>

</html>
